[project]
name = "open-gto"
version = "0.1.0"
description = "A poker GTO solver (CFR/CFR+/DCFR) with a range-grid UI"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "fastapi>=0.110", "uvicorn>=0.29", "pydantic>=2.6"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["engine", "engine.games", "api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: longer-running convergence/integration tests"]
